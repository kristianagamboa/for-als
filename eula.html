<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms and Conditions</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:"Figtree",system-ui,sans-serif;color:#5a3a45;
    background:radial-gradient(900px 600px at 20% 10%,#fff3f5,transparent 60%),radial-gradient(900px 700px at 90% 90%,#f7cfd9,transparent 60%),#fdeef1}
  .wrap{position:relative;max-width:640px;width:100%;text-align:center;background:linear-gradient(180deg,rgba(255,252,247,.94),rgba(253,236,240,.88));
    border-radius:28px;padding:clamp(32px,6vw,60px) clamp(24px,5vw,56px);border:1px solid rgba(217,140,160,.4);
    box-shadow:0 22px 60px rgba(169,78,106,.2),0 0 0 8px rgba(255,255,255,.45),0 0 0 9px rgba(217,140,160,.25)}
  .wrap::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(217,140,160,.55);border-radius:20px;pointer-events:none}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.8rem,9vw,4.6rem);margin:0 0 .3em;color:#a94e6a;animation:pop 1.6s ease-in-out infinite alternate}
  p{font-size:clamp(1.1rem,2.6vw,1.35rem);line-height:1.8;margin:0}
  .lily{position:absolute;width:84px;height:84px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(169,78,106,.25))}
  .tl{left:-30px;top:-30px;transform:rotate(-20deg)}.br{right:-30px;bottom:-30px;transform:rotate(25deg)}
  .heart{position:fixed;bottom:-30px;color:rgba(217,110,140,.5);animation:rise 9s linear infinite}
  @keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
  @keyframes pop{to{transform:scale(1.05) rotate(-1deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<script src="js/lilies.js"></script>
<span class="heart" style="left:12%;animation-delay:0s">&#9825;</span>
<span class="heart" style="left:32%;animation-delay:3s;font-size:26px">&#9825;</span>
<span class="heart" style="left:58%;animation-delay:1.5s">&#9825;</span>
<span class="heart" style="left:80%;animation-delay:5s;font-size:24px">&#9825;</span>
<main class="wrap">
  <svg class="lily tl" aria-hidden="true"><use href="#lily"/></svg>
  <svg class="lily br" aria-hidden="true"><use href="#lily"/></svg>
  <h1>SURPRISE !!</h1>
  <p>our date will be my treat. and i'll also sundo you sa may kanto niyo in longos. you agreed remember? no turning back now bleh</p>
</main>
</body>
</html>
